plugins { id 'com.android.application' }
android {
    namespace 'id.richtranslate'
    compileSdk 34
    defaultConfig {
        applicationId 'id.richtranslate'
        minSdk 30
        targetSdk 34
        versionCode 10
        versionName '0.10.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    packaging { jniLibs { useLegacyPackaging true }; dex { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = '384m'; forkEvery = 1 } }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
